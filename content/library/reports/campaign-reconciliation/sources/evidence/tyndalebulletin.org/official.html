  <script>
    window.JOURNAL = {"cover_url":"https://assets.scholasticahq.com/assets/default_journal_cover-9f2e87fdf6f329fabf4561fb3741ab0ae9843759e3409b03ceb407a73ab80a02.jpg","description":"#Aims and scope\n**_Tyndale Bulletin_** is a peer-reviewed academic journal which publishes scholarly articles that make an original contribution to biblical studies and related disciplines. It is the journal of [Tyndale House, Cambridge](https://academic.tyndalehouse.com/), a UK-based research institute and residential library dedicated to biblical scholarship.\n_(Please note: we are no longer publishing articles in ethics or systematic/philosophical/historical theology.)_\n\nThis site hosts new articles as they are published, together with all previously published articles reaching back to volume 1 (1956). \nVolumes 1–16 were published under the title _The Tyndale House Bulletin_.\n\nA print edition of the articles published each year is available to subscribers; for details please visit the [Subscribe](https://tyndalebulletin.org/pages/178-subscribe) page. \n___\n#Open Access and Licensing\n_Tyndale Bulletin_ provides immediate, free, open access to its articles, under the following terms:\n\n_**Articles from volume 72 (2021) onwards:**_\nFrom volume 72 onwards, articles are released under under a [Creative Commons CC BY-NC-ND](https://creativecommons.org/licenses/by-nc-nd/4.0/) license. For commercial reuse of material from these articles, or the distribution of derivative works, please contact the Editor at [bulletin@tyndalehouse.com](bulletin@tyndalehouse.com).\n\n_**Articles from volume 71 (2020) and earlier:**_\nFor commercial reuse, or distribution of derivative works, of articles from volume 71 and earlier, please contact the Editor at [bulletin@tyndalehouse.com](bulletin@tyndalehouse.com).\nFor non-commercial purposes users may read, download, copy, distribute, print, search, or link to the full texts of articles, crawl them for indexing, pass them as data to software, or use them for any other lawful purpose, providing appropriate credit is given. \n___\n#Indexing\n_Tyndale Bulletin_ is indexed in the [Atla Religion Database](https://www.atla.com/), the [Directory of Open Access Journals](https://doaj.org/), [ERIH Plus](https://kanalregister.hkdir.no/publiseringskanaler/erihplus/), [Web of Science](https://mjl.clarivate.com/home), [Scopus](https://www.scopus.com/) and [Google Scholar](https://scholar.google.co.uk/).\n___\n#Archiving\n_Tyndale Bulletin_ uses the [Portico](https://www.portico.org/) archiving service to ensure the long-term accessibility of articles.\n___\n#Title history\nISSN 0082-7118 (Print) – _Tyndale Bulletin_ (Year 1966 to date)\nISSN 2752-7042 (Online) – _Tyndale Bulletin_ (Year 1966 to date)\n_Previously:_\nISSN 1757-0514 (Print) – _The Tyndale House Bulletin_ (Year 1956–1965)\nISSN 2752-7034 (Online) – _The Tyndale House Bulletin_ (Year 1956–1965)\n___","e_issn":"2752-7042","editorial_board":"#Editor\n**[Dr J. C. Howard](https://tyndalehouse.com/faces/howard-j-caleb/)** (Research Fellow in Old Testament and Ancient Near East, Tyndale House, Cambridge)\n#Associate Editors\n**[Dr D. J. Armitage](https://tyndalehouse.com/faces/armitage-david/)** (Managing Editor / Academic Administrator, Tyndale House, Cambridge)\n**[Dr D. Jongkind](https://tyndalehouse.com/faces/jongkind-dirk/)** (Senior Research Fellow and Vice Principal (Academic), Tyndale House, Cambridge)\n#Advisory Editors\n**Dr T. D. Alexander** (Senior Research Fellow in Biblical Studies, Union Theological College, Belfast)\n**Prof. Dr A. Baum** (Professor of New Testament, Freie Theologische Hochschule, Gießen)\n**Dr P. Head** (Tutorial Fellow in New Testament, Wycliffe Hall, Oxford)\n**Prof. D. Tsumura** (Professor of Old Testament, Japan Bible Seminary)\n**Dr P. J. Williams** (Principal, Tyndale House, Cambridge)\n**Dr A. I. Wilson** (Lecturer in Mission and New Testament, Edinburgh Theological Seminary)\n#Editorial Assistants\n**B. Gardner** (PhD candidate, University of Cambridge)\n**J. Parker** (PhD candidate, University of Cambridge)","id":2118,"name":"Tyndale Bulletin","slug":"tynbul","submission_guidelines":"**_Tyndale Bulletin_ publishes scholarly articles which make an original contribution to biblical studies and related disciplines.**\n\nBefore submitting an article please read carefully the instructions below.\n\nContributions are expected to be compatible with the [doctrinal basis](https://tyndalehouse.com/about/doctrinal-basis/) of [Tyndale House, Cambridge](https://tyndalehouse.com/).  _Please note: we are no longer publishing articles in ethics or in systematic/philosophical/historical theology._\n___\n#Author credentials\nAuthors submiting articles for consideration who do not have _either_ of the following should provide a recommendation from an established scholar alongside their submission: \n- A completed PhD/DPhil in biblical studies or a related discipline relevant to their article (e.g. archaeology, classics).\n- A record of previous peer reviewed scholarly publications in biblical studies or a related discipline relevant to their article.\n\nThe scholar providing the recommendation should have a PhD/DPhil in the relevant subject area.  For doctoral students the recommendation should usually be provided by the student’s supervisor. \nThe scholar's recommendation should affirm that they have read the submitted article, that they believe it is suitable for an academic journal, and that they believe it makes an original contribution to knowledge on the subject.\n___\n#Submission of articles\nManuscripts should be submitted for publication in _Tyndale Bulletin_ via Scholastica using the blue 'Submit a manuscript' button above. For help using Scholastica, see the [Author Guide](https://help.scholasticahq.com/article/72-author-guide). \n\nThe **_Tyndale Bulletin_ Style Guide** is available for download as a pdf **[here](https://tyndalehouse.com/tyndale-house/wp-content/uploads/2026/02/Tyndale-Bulletin-Style-Guide-February-2026.pdf)**. There is no requirement to conform fully to _Tyndale Bulletin_ style for an initial submission. However, references for works cited should be provided in full in footnotes; submissions should not use the ‘author-date’ citation format. **A full bibliography must also be included**. \n\nPreference will be given to articles of 8,500 words or fewer (including footnotes). Manuscripts should begin with an abstract of 70-200 words and should be submitted along with 5-8 keywords. \nSince the readership of _Tyndale Bulletin_ is varied, specialist terminology should be explained, and an English translation should be provided alongside quotations in other languages.\n\nSubmissions should be **anonymised** for blind review: \n  * The author’s name must be removed throughout the text, including headers and title page. Other possible identifiers (e.g. institutional affiliation) should also be removed.\n  * Author self-citation should be reworded in the third person, where possible. Where self-citation is unavoidable, names should be replaced in text and footnotes with ‘Author’, and references in footnotes and bibliography converted to the form ‘Author, ([Year]).’\n  * Files should be submitted for review in pdf format. (Scholastica automatically anonymises pdf metadata in files made available to reviewers.)\n\n(The only exceptions to the requirement for anonymisation are articles derived from public lectures, and articles where an author seeks to revisit – or interact with critique of – their own previously published work.)\n  \nAuthors are asked to write as concisely as possible in clear English prose. If English is not an author's native language, their work should be proofread by a native English speaker. \n\nA downloadable checklist of submission requirements is available **[here](https://tyndalehouse.com/tyndale-house/wp-content/uploads/2025/09/Tyndale-Bulletin-author-checklist-v2.docx)**.\n\n**By submitting an article for publication in _Tyndale Bulletin_, authors affirm that it has not been published previously and will not be submitted simultaneously elsewhere.**\n___\n#Dissertation summaries\n_Tyndale Bulletin_ publishes dissertation summaries for recent doctoral work which has, at least in part, been carried out at [Tyndale House, Cambridge](https://academic.tyndalehouse.com). Submissions, which are subject to internal editorial review, should be between 1000 and 1400 words and should conform to the _Tyndale Bulletin_ style guide. Authors should provide details of their association with Tyndale House, ideally including the relevant dates.\n___\n#Publication fee policy\nThere are no publication fees or article processing charges for publishing in _Tyndale Bulletin_.\n___\n#Anti-plagiarism policy\nManuscripts submitted to _Tyndale Bulletin_ will be screened for plagiarism using the Similarity Check service from [Crossref](https://www.crossref.org/). This uses [iThenticate](https://www.ithenticate.com/) software to compare submitted material to a wide range of previously published material.\n___\n#AI tools\nAny use of AI tools / Large Language Models such as ChatGPT in the composition of an article submitted to _Tyndale Bulletin_ must be acknowledged, indicating what tool was used and how it was employed. \n___\n#Peer review policy\nThe _Tyndale Bulletin_ operates a double-blind peer review process for journal articles. Accepted articles will in most cases have had at least two double-blind peer reviews. Exceptions include published versions of public lectures/seminars, and articles where authors develop, or respond to critiques of, their own previous work. In these cases – at the discretion of the editors – single-blind review may be used.\n\nAll submissions are initially evaluated by the Editor for their suitability for this journal. It is at the Editor’s discretion to reject without further review submissions that are outside the scope of the journal, or where the quality of writing and formatting are inadequate. Submissions that are considered suitable for further review are sent to at least two independent experts for detailed examination. Reviewers’ identities are not revealed to authors, nor vice versa (except in the rare cases noted in the previous paragraph). The responses of the expert reviewers are then evaluated by members of the Editorial Board, who will recommend one of the following outcomes:\n* Accept\n* Revise and resubmit\n* Reject\n\nThe final decision rests with the Editor. \n\n**Revision and Resubmission process:**\n* It is at the discretion of the Editor what further review takes place with resubmitted articles.\n* There may be multiple cycles of review and revision.\n* There is no guarantee that resubmitted articles will be accepted.\n\nFurther information about the review processes of the _Tyndale Bulletin_ is available in the following blog posts:\n* [How does the _Tyndale Bulletin_ review process work?]( https://tyndalebulletin.org/post/1580-how-does-the-_tyndale-bulletin_-review-process-work)\n* [_Tyndale Bulletin_ peer review: the key questions](https://tyndalebulletin.org/post/1583-_tyndale-bulletin_-peer-review-the-key-questions)\n\nFollowing acceptance, articles are copy-edited. Further refinements (especially with regard to style) may be suggested, or in some cases required, prior to final approval for publication.\n___\n#Copyright and Licensing\nFrom 2021 (vol. 72), new articles will be released under a [Creative Commons CC BY-NC-ND](https://creativecommons.org/licenses/by-nc-nd/4.0/) license. Copyright will be held by [Tyndale House and Institute, Cambridge](https://academic.tyndalehouse.com). \n\nAuthors of articles from 2021 (vol. 72) onwards are permitted (in addition to what is permitted by the CC BY-NC-ND license) to reproduce their own article or an adapted version of it in any volume of which they are editor or author subject to normal acknowledgement.\n\nThe Copyright Transfer Agreement that authors are asked to sign prior to publication of their work can be viewed **[here](https://tyndalehouse.com/tyndale-house/wp-content/uploads/2025/09/Tyndale-Bulletin-Copyright-transfer-agreement-1.docx)**.\n\nFor commercial reuse of material from these articles other than by the author, or the distribution of derivative works other than by the author, please contact the Editor at [bulletin@tyndalehouse.com](bulletin@tyndalehouse.com). \n\n\n_For Authors of articles from 2020 (vol. 71) and earlier_:\nIf you wish to republish the text on paper or electronically in a form other than the original PDF within two years of first publication, please contact the Editor ([bulletin@tyndalehouse.com](bulletin@tyndalehouse.com)). Beyond two years from first publication, you may republish your own article in any form without asking permission, though please state that it was first published in _Tyndale Bulletin_ and include a link to tyndalebulletin.org.","about_page_banner":{"id":2118,"name":"photo-1522442676585-c751dab71864","size":5953572,"content_type":"image/jpeg","url":"https://s3.amazonaws.com/production.scholastica/journal/2118/about_page_banner/original/photo-1522442676585-c751dab71864?1631873004","thumb":"https://s3.amazonaws.com/production.scholastica/journal/2118/about_page_banner/thumb/photo-1522442676585-c751dab71864?1631873004","small":"https://s3.amazonaws.com/production.scholastica/journal/2118/about_page_banner/small/photo-1522442676585-c751dab71864?1631873004","medium":"https://s3.amazonaws.com/production.scholastica/journal/2118/about_page_banner/medium/photo-1522442676585-c751dab71864?1631873004","large":"https://s3.amazonaws.com/production.scholastica/journal/2118/about_page_banner/large/photo-1522442676585-c751dab71864?1631873004"},"about_page_banner_color":"#16778f","about_page_banner_style":"image","accepting_submissions":true,"acronym":"Tyndale Bulletin","article_grid_layout":"dynamic","article_grid_layout_has_images":true,"banner_font_style":"sans","bluesky_username":"@tyndalebulletin.bsky.social","city":"Cambridge","editorial_board_page_banner":{"id":2118,"name":"nt_greek_spines2.jpg","size":790194,"content_type":"image/jpeg","url":"https://s3.amazonaws.com/production.scholastica/journal/2118/editorial_board_page_banner/original/nt_greek_spines2.jpg?1632134514","thumb":"https://s3.amazonaws.com/production.scholastica/journal/2118/editorial_board_page_banner/thumb/nt_greek_spines2.jpg?1632134514","small":"https://s3.amazonaws.com/production.scholastica/journal/2118/editorial_board_page_banner/small/nt_greek_spines2.jpg?1632134514","medium":"https://s3.amazonaws.com/production.scholastica/journal/2118/editorial_board_page_banner/medium/nt_greek_spines2.jpg?1632134514","large":"https://s3.amazonaws.com/production.scholastica/journal/2118/editorial_board_page_banner/large/nt_greek_spines2.jpg?1632134514"},"editorial_board_page_banner_color":"#17758F","editorial_board_page_banner_style":"image","facebook_url":null,"for_authors_page_banner":{"id":2118,"name":"tyndale_house_2022_high_res_021.jpg","size":1473936,"content_type":"image/jpeg","url":"https://s3.amazonaws.com/production.scholastica/journal/2118/for_authors_page_banner/original/tyndale_house_2022_high_res_021.jpg?1676289552","thumb":"https://s3.amazonaws.com/production.scholastica/journal/2118/for_authors_page_banner/thumb/tyndale_house_2022_high_res_021.jpg?1676289552","small":"https://s3.amazonaws.com/production.scholastica/journal/2118/for_authors_page_banner/small/tyndale_house_2022_high_res_021.jpg?1676289552","medium":"https://s3.amazonaws.com/production.scholastica/journal/2118/for_authors_page_banner/medium/tyndale_house_2022_high_res_021.jpg?1676289552","large":"https://s3.amazonaws.com/production.scholastica/journal/2118/for_authors_page_banner/large/tyndale_house_2022_high_res_021.jpg?1676289552"},"for_authors_page_banner_color":"#17758F","for_authors_page_banner_style":"image","header_orientation":"left","homepage_header_background_color":"#238a9b","homepage_header_backgro
