<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Read the Bible in every free version, in sixteen languages — with charts, graphs and an atlas of the whole Bible." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews (texts, social apps). A new picture gets a NEW file name: apps remember previews by address.
         Made by scripts/og-image.mjs from src/dev/og/ (design "free-open"). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bible Project" />
    <meta property="og:title" content="Bible Project" />
    <meta property="og:description" content="The whole Bible, free and open to all: 37 versions in 17 languages, with studies, topics and an atlas." />
    <meta property="og:url" content="https://bibleproject.io/" />
    <meta property="og:image" content="https://bibleproject.io/share-bible-project-2026-10-08-crosses.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bible Project: a radiant sun with the Trinity triangle between two crosses and stars, and the words The whole Bible, free and open to all." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bible Project" />
    <meta name="twitter:description" content="The whole Bible, free and open to all: 37 versions in 17 languages, with studies, topics and an atlas." />
    <meta name="twitter:image" content="https://bibleproject.io/share-bible-project-2026-10-08-crosses.png" />
    <meta name="twitter:image:alt" content="Bible Project: a radiant sun with the Trinity triangle between two crosses and stars, and the words The whole Bible, free and open to all." />
    <title>Bible Project</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem("bp-theme");
        if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
      } catch (error) {
        console.warn("theme: localStorage unavailable", error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
