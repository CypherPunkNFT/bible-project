<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Bible Guide is a free Bible website: read the whole Bible in 160 free versions and 140 languages, with study guides, an atlas of every Bible place, 5,603 topics, apologetics, hymns and teachers." />
    <!-- Tells search engines the site's name (shown above results) and who makes it. Page titles, descriptions and the
         official address of each page: src/lib/page-head.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://bibleguide.io/#website",
            "name": "Bible Guide",
            "alternateName": ["BibleGuide", "bibleguide.io"],
            "url": "https://bibleguide.io/",
            "inLanguage": "en",
            "publisher": { "@id": "https://bibleguide.io/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": { "@type": "EntryPoint", "urlTemplate": "https://bibleguide.io/search?q={search_term_string}" },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://bibleguide.io/#organization",
            "name": "Bible Guide",
            "url": "https://bibleguide.io/",
            "logo": "https://bibleguide.io/favicon.svg",
            "description": "A free Bible website: the whole Bible in every free version, with study guides, an atlas, topics, apologetics and hymns.",
            "founder": { "@type": "Person", "name": "Lucas Campbell Saint Laurent" },
            "sameAs": ["https://github.com/CypherPunkNFT/bible-project"]
          }
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews (texts, social apps). A new picture gets a NEW file name: apps remember previews by address.
         Made by scripts/og-image.mjs from src/dev/og/ (design "free-open"). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bible Guide" />
    <meta property="og:title" content="Bible Guide" />
    <meta property="og:description" content="The whole Bible, free and open to all: 160 versions in 140 languages, with studies, topics and an atlas." />
    <meta property="og:url" content="https://bibleguide.io/" />
    <meta property="og:image" content="https://bibleguide.io/share-bible-guide-2026-10-23.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bible Guide: a radiant sun with the Trinity triangle between two crosses and stars, and the words The whole Bible, free and open to all." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bible Guide" />
    <meta name="twitter:description" content="The whole Bible, free and open to all: 160 versions in 140 languages, with studies, topics and an atlas." />
    <meta name="twitter:image" content="https://bibleguide.io/share-bible-guide-2026-10-23.png" />
    <meta name="twitter:image:alt" content="Bible Guide: a radiant sun with the Trinity triangle between two crosses and stars, and the words The whole Bible, free and open to all." />
    <title>Bible Guide</title>
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one: dark unless this browser chose light.
      let theme = "dark";
      try {
        if (localStorage.getItem("bp-theme") === "light") theme = "light";
      } catch (error) {
        console.warn("theme: localStorage unavailable", error);
      }
      document.documentElement.dataset.theme = theme;
    </script>
    <script>
      // Same for a translated language (src/lib/language.ts keeps the reader's choice): <html lang> and the reading
      // direction are set before first paint, and the ready-made English page stays hidden until the language's words have
      // loaded (src/main.tsx shows it), or for 4 s at most should the code not arrive. The build writes the languages in
      // from src/lib/site-languages.json (scripts/site-languages-vite.ts), so none is named here; an unreleased one counts
      // only on this computer's preview, as in language.ts. A script of its own, so nothing here can stop the theme.
      try {
        const languages = /*site-languages*/{};
        const code = localStorage.getItem("bp-language");
        const language = code !== null && Object.prototype.hasOwnProperty.call(languages, code) ? languages[code] : null;
        if (language && (language.released || location.hostname === "127.0.0.1" || location.hostname === "localhost")) {
          document.documentElement.lang = code;
          document.documentElement.dir = language.dir === "rtl" ? "rtl" : "ltr";
          document.documentElement.dataset.languageLoading = "true";
          setTimeout(() => delete document.documentElement.dataset.languageLoading, 4000);
          // The language's words start loading now, not once the site's code has arrived (src/lib/phrase-lists.ts takes
          // these over): its core phrase list, and a study or people page's own list (PAGE_FILES in page-translator.ts).
          // The release writes its stamp of the lists here (scripts/phrase-lists.mjs), so browsers may keep them.
          const stamp = /*phrase-stamp*/"";
          window.__bgStamp = stamp;
          const lists = ["phrases/core.json" + (stamp ? "?v=" + stamp : "")];
          if (/^\/(study2?|teachers)(\/|$)/.test(location.pathname)) lists.push("ui-study.json");
          else if (/^\/people\//.test(location.pathname)) lists.push("ui-people.json");
          window.__bgEarly = {};
          for (const list of lists) {
            const address = "/data/i18n/" + language.folder + "/" + list;
            window.__bgEarly[address] = fetch(address, { cache: stamp && list.startsWith("phrases/") ? "default" : "no-cache" })
              .then((response) => (response.ok ? response.json() : response.status))
              .catch(() => null);
          }
        }
      } catch (error) {
        console.warn("language: localStorage unavailable", error);
      }
    </script>
    <style>html[data-language-loading] #root { visibility: hidden; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
