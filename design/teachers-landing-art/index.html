<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers · four SVG studies</title>
<style>
@font-face{font-family:Literata;src:url('/node_modules/@fontsource-variable/literata/files/literata-latin-wght-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#12110e;color:#ece7db;font:14px/1.6 Arial,sans-serif;--gold:#dfb354;--line:#363229;--muted:#afa18a}body.light{background:#f6f1e7;color:#29251e;--gold:#99721f;--line:#d9cfbd;--muted:#786b57}header{max-width:1600px;margin:32px auto 24px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:24px}header h1{font:400 26px Literata,Georgia,serif;margin:0}header p{margin:6px 0;color:var(--muted)}button{font:inherit;border:1px solid var(--line);color:inherit;background:transparent;padding:8px 16px;border-radius:30px;cursor:pointer}button:hover{border-color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;max-width:1600px;margin:auto;padding:0 28px 40px;gap:24px}.study{border-top:1px solid var(--line);padding:18px 22px 24px;min-width:0;outline:none}.study:focus-visible{outline:1px solid var(--gold)}.label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--muted)}.label b{color:var(--gold);font-weight:400}.hero{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:10px;margin:22px 0}.kicker{font-size:9px;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:10px}.kicker:before{content:'';width:20px;height:1px;background:currentColor}.hero h2{font:500 clamp(24px,2.45vw,38px)/1.14 Literata,Georgia,serif;letter-spacing:-.04em;margin:14px 0}.hero p{font-size:12px;color:var(--muted);max-width:37ch}.art{width:100%;height:auto;overflow:visible;color:var(--gold)}.art path,.art circle{fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}.art .fine{stroke-width:.75;opacity:.8}.art .faint{stroke-width:.65;opacity:.55}.base{opacity:.75}.live{opacity:0;transition:opacity .5s}.study:is(:hover,:focus-within) .live,.playing .live{opacity:1}.study:is(:hover,:focus-within) .live path,.playing .live path{animation:draw 1.3s calc(var(--d,0)*1.1s) cubic-bezier(.45,0,.2,1) both}.study:is(:hover,:focus-within) .live .leaves,.playing .live .leaves{animation:breathe 6s ease-in-out infinite;transform-origin:120px 100px}.study:is(:hover,:focus-within) .live .star,.playing .live .star{animation:draw 1.3s calc(var(--d,0)*1.1s) both,twinkle 4s calc(var(--d,0)*2s) ease-in-out infinite}.study:is(:hover,:focus-within) .base .leaves,.playing .base .leaves{visibility:hidden}@keyframes draw{0%{stroke-dasharray:1;stroke-dashoffset:1}99.9%{stroke-dasharray:1;stroke-dashoffset:0}100%{stroke-dasharray:none;stroke-dashoffset:0}}@keyframes breathe{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(1deg)}}@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.95}}.utility{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,.9fr);gap:22px;align-items:center}.search{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:30px;color:var(--muted)}.search svg{width:15px;flex:none}.search input{width:100%;min-width:0;color:inherit;background:none;border:none;outline:none;font:11px Arial}.search:focus-within{border-color:var(--gold)}.search input::placeholder{color:var(--muted)}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;border-left:1px solid var(--line);padding-left:20px;margin:0}dt{font-size:8px;letter-spacing:.15em;color:var(--muted)}dd{font:400 22px Literata,Georgia,serif;margin:0}.timeline{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.timeline p{font-size:9px;color:var(--muted);margin:0}.dots{height:56px;display:flex;align-items:center;justify-content:space-between;position:relative}.dots:before{content:'';position:absolute;left:0;right:0;height:1px;background:var(--line)}.dots i{position:relative;width:24px;height:24px;display:grid;place-items:center;border:1px solid #9b8154;border-radius:50%;font:9px Georgia;background:#27231b;color:#ddc796}.dots i:nth-child(3n){border-color:#61968f;color:#9ac5bd;background:#1c2a27}.dots i:nth-child(3n + 1){border-color:#8b7ba9;color:#bcb0cf;background:#29242f}.years{display:flex;justify-content:space-between;color:var(--muted);font-size:8px}.note{font-size:11px;color:var(--muted);margin:16px 0 0}.light .dots i{background:#f0e7d6;color:#706143}@media(max-width:1050px){.grid{grid-template-columns:1fr}.hero h2{font-size:38px}.art{max-width:310px}.hero{gap:30px}.study{padding-inline:12px}}@media(max-width:540px){header{align-items:start;flex-direction:column}.grid{padding:0 16px}.hero{grid-template-columns:1fr;gap:0}.art{width:240px;justify-self:center}.hero h2{font-size:34px}.utility{grid-template-columns:1fr}dl{border-left:0;border-top:1px solid var(--line);padding:14px 0 0;grid-template-columns:repeat(4,1fr);gap:10px}dd{font-size:20px}}@media(prefers-reduced-motion:reduce){.art *{animation:none!important;transition:none!important;stroke-dasharray:none!important}}
</style></head><body><header><div><h1>Teachers · four SVG studies</h1><p>New artwork in the teachers page’s line style. Hover or focus a study to animate.</p></div><div><button id="play">Animate all</button> <button id="theme">Light / dark</button></div></header><main class="grid" id="grid"></main><script src="art.js"></script></body></html>
