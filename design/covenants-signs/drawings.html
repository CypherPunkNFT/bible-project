<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Covenants and promises · four drawings</title>
<link rel="icon" href="../letters-shared/favicon.svg">
<script>try{const t=localStorage.getItem("bp-theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){console.warn("theme: localStorage unavailable",e)}</script>
<link rel="stylesheet" href="../authors-directions/shared/frame.css">
<link rel="stylesheet" href="css/cov-land.css">
<style>
  body { margin: 0; background: var(--page); color: var(--ink); }
  .dr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); }
  .dr-cell { display: block; overflow: hidden; padding: clamp(1rem, 3vw, 2.5rem); background: var(--page); color: inherit; text-decoration: none; }
  .dr-cell:hover h2, .dr-cell:focus-visible h2 { color: var(--accent); text-decoration: underline; }
  .dr-cell:focus { outline: none; }
  .dr-cell h2 { margin: 1rem 0 0; font: 500 clamp(1.05rem, 1.6vw, 1.4rem)/1.3 var(--serif, Georgia, serif); }
  .dr-cell .cl-art { margin: 0; max-width: none; }
  @media (max-width: 720px) { .dr-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main class="dr-grid" id="drawings"></main>
<script src="js/drawings.js"></script>
<script src="js/drawings-more.js"></script>
<script>
  const NAMES = ["1. All five under the bow", "2. Count the stars", "3. The mountain", "4. The cup"];
  document.getElementById("drawings").innerHTML = CovDrawings.list.map((drawing, i) => `<a class="dr-cell" href="./?drawing=${i + 1}"><div class="cl-art">${drawing}</div><h2>${NAMES[i]}</h2></a>`).join("");
</script>
</body>
</html>
