<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The hope to come · what was lost, as cards</title>
<link rel="icon" href="../letters-shared/favicon.svg">
<script>try{const t=localStorage.getItem("bp-theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){console.warn("theme: localStorage unavailable",e)}</script>
<link rel="stylesheet" href="../authors-directions/shared/frame.css">
<link rel="stylesheet" href="css/land.css">
<style>
  body { margin: 0; background: var(--page); color: var(--ink); }
  .lc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(1.5rem, 3vw, 3rem); padding: clamp(1.5rem, 4vw, 4rem) var(--hz-gutter); }
  .lc-cell { display: flex; flex-direction: column; }
  .lc-cell-wide { grid-column: 1 / -1; }
  .lc-cell > header p { margin: 0 0 .75rem; color: var(--muted); }

  .lc { position: relative; flex: 1; display: grid; grid-template-rows: 1fr auto 1fr; overflow: hidden; border-radius: 1.25rem; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--surface); }
  .lc-art { position: absolute; inset: 0; }
  .lc-art svg { display: block; width: 100%; height: 100%; }
  .lc-half { position: relative; display: flex; flex-direction: column; gap: .5rem; min-height: 15rem; padding: clamp(1.25rem, 2.5vw, 2rem); }
  .lc-cell-wide .lc-half { min-height: 18rem; }
  .lc-half > :not(.lc-art) { position: relative; max-width: min(26rem, 58%); }

  /* Fixed colours: the art does not change with the theme, so the words on it do not either. */
  .lc-dark { color: #efe9dc; }
  .lc-dark .lc-tag, .lc-dark .lc-name { color: #ecc77d; }
  .lc-dark .lc-ref { color: #f1d58a; }
  .lc-light { color: #1d2a16; }
  .lc-light .lc-tag { color: #6b4c10; }
  .lc-light .lc-ref { color: #5b3d0a; }
  .lc-half::before { content: ""; position: absolute; inset: 0; }
  .lc-dark::before { background: linear-gradient(to right, rgb(8 10 14 / .6), transparent 70%); }
  .lc-light::before { background: linear-gradient(to right, rgb(255 251 236 / .72), transparent 70%); }

  .lc-name { margin: 0 0 .25rem; font: 500 clamp(1.5rem, 2.4vw, 2.1rem)/1.1 var(--serif); }
  .lc-words { display: flex; flex-direction: column; gap: .35rem; }
  .lc-tag { font: 600 .7rem var(--sans); letter-spacing: .16em; text-transform: uppercase; }
  .lc-phrase { margin: 0; font: 400 clamp(1.15rem, 1.7vw, 1.45rem)/1.3 var(--serif); }
  .lc-ref { font-size: .85rem; text-decoration: underline; text-underline-offset: .2em; }
  .lc-kind { align-self: flex-start; margin-top: auto; padding: .2rem .65rem; border-radius: 999px; background: rgb(255 251 236 / .85); font-size: .78rem; }

  /* The prophets between, on a gold belt (the owner's choice). Every row has one: the three the study leaves empty get theirs from redeemed-verses.js. */
  .lc-seam { position: relative; z-index: 1; padding: .7rem clamp(1.25rem, 2.5vw, 2rem); background: linear-gradient(to bottom, #f0c968, #d9a640); }
  .lc-seam-empty { min-height: calc(1.05rem * 1.5 + 1.4rem); }
  .lc-mid { margin: 0; font: italic 400 1.05rem/1.5 var(--serif); color: #1b1408; }
  .lc-mid i { margin: 0 .6rem; font-style: normal; color: #3d2806; }
  .lc-mid .lc-ref { margin-left: .2rem; font-style: normal; color: #3d2806; }
  .lc-mid-tag { margin-right: .75rem; font: 600 .7rem var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #5a3d0a; }
  .lc-grid { padding-bottom: 6rem; }

  @media (max-width: 1100px) { .lc-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    .lc-half > :not(.lc-art) { max-width: 100%; }
    .lc-dark::before { background: rgb(8 10 14 / .5); }
    .lc-light::before { background: rgb(255 251 236 / .7); }
  }
</style>
</head>
<body>
<main class="lc-grid" id="cards"></main>
<script src="../the-hope-to-come-directions/data.js"></script>
<script src="js/redeemed-verses.js"></script>
<script src="js/lost-cards-art.js"></script>
<script src="js/lost-cards.js"></script>
</body>
</html>
