<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teachers · SVG drawings</title><style>
*{box-sizing:border-box}body{margin:0;background:#12110f;color:#d9ad50;--ground:#12110f;--line:#302c25;--ink:#e8e1d2}.light{background:#f6f1e7;color:#a0792e;--ground:#f6f1e7;--line:#d9cfbd;--ink:#302b22}main{max-width:1150px;margin:40px auto;display:grid;grid-template-columns:1fr 1fr;padding:0 24px}.drawing{position:relative;display:grid;place-items:center;min-height:340px;border-bottom:1px solid var(--line);outline:none}.drawing:nth-child(odd){border-right:1px solid var(--line)}.drawing:nth-last-child(-n+2){border-bottom:0}.drawing>span{position:absolute;left:24px;top:24px;font:11px monospace;color:inherit;opacity:.7}svg{width:min(78%,340px);overflow:visible}svg *{stroke-linecap:round;stroke-linejoin:round}path,ellipse,circle{fill:none;stroke:currentColor;stroke-width:1.1}.fine{stroke-width:.75;opacity:.8}.faint{stroke-width:.65;opacity:.48}.ink{stroke:var(--ink);opacity:.7;stroke-width:.85}.base{opacity:.88}.live{opacity:0;transition:opacity .4s}.drawing:is(:hover,:focus-visible) .live{opacity:1}.drawing:is(:hover,:focus-visible) .live path{animation:draw 1.3s calc(var(--d)*1.1s) cubic-bezier(.45,0,.2,1) both}.drawing:is(:hover,:focus-visible) .base .moving{visibility:hidden}.drawing:is(:hover,:focus-visible) .live .flame{animation:flame 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.drawing:is(:hover,:focus-visible) .live .bell{animation:bell 5s ease-in-out infinite;transform-origin:120px 53px}.drawing:is(:hover,:focus-visible) .live .press{animation:press 7s ease-in-out infinite}.drawing:is(:hover,:focus-visible) .live .quill{animation:quill 7s ease-in-out infinite;transform-origin:152px 124px}.drawing:is(:hover,:focus-visible) .live .sand{animation:sand 4s linear infinite;stroke-dasharray:1}.drawing:is(:hover,:focus-visible) .live .rays{animation:rays 5s ease-in-out infinite}@keyframes draw{0%{stroke-dasharray:1;stroke-dashoffset:1}99.9%{stroke-dasharray:1;stroke-dashoffset:0}100%{stroke-dasharray:none;stroke-dashoffset:0}}@keyframes flame{0%,100%{transform:scale(1) skewX(0)}40%{transform:scale(.94,1.08) skewX(3deg)}70%{transform:scale(1.04,.97) skewX(-2deg)}}@keyframes bell{0%,20%,100%{transform:rotate(0)}35%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}80%{transform:rotate(-3deg)}}@keyframes press{0%,20%,100%{transform:translateY(0)}45%,65%{transform:translateY(7px)}}@keyframes quill{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes sand{from{stroke-dashoffset:2}to{stroke-dashoffset:0}}@keyframes rays{0%,100%{opacity:.25}50%{opacity:.8}}button{position:fixed;right:20px;bottom:15px;background:var(--ground);color:inherit;border:1px solid var(--line);border-radius:24px;padding:8px 12px;font:11px Arial;cursor:pointer}.drawing:focus-visible{outline:1px solid currentColor;outline-offset:-4px}@media(max-width:600px){main{grid-template-columns:1fr;margin:12px auto}.drawing{min-height:300px}.drawing:nth-child(odd){border-right:0}.drawing:nth-last-child(2){border-bottom:1px solid var(--line)}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important;stroke-dasharray:none!important}}
</style></head><body><main id="drawings"></main><button onclick="document.body.classList.toggle('light')">Light / dark</button><script src="drawings.js"></script></body></html>
